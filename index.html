<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Journal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.5/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
    select {
      background-color: #4b5563;
      border: 3px solid #6b7280;
      color: #e5e7eb;
    }
    .border3 {
      border: 3px solid gray !important;
    }
    select:focus {
      outline: none;
      ring: 3px solid #3b82f6;
    }
    .parallax-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('background.jpg');
      background-size: cover;
      transform: translate3d(0, 0, 0);
      transition: transform 0.1s ease-out;
      z-index: -1;
    }
    .smooth-transition {
      transition: all 0.3s ease-in-out;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-200">
  <div class="parallax-bg"></div>
  <div class="min-h-screen flex flex-col sm:flex-row relative">
    <!-- Sidebar -->
    <div class="w-full sm:w-16 md:w-56 bg-gray-800 p-4 flex flex-col smooth-transition z-10">
      <h1 class="text-2xl font-bold text-white mb-6 hidden sm:block">Trading Journal</h1>
      <h1 class="text-xl font-bold text-white mb-4 sm:hidden">TJ</h1>
      <select id="profileSelect" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 mb-4 smooth-transition">
        <option value="Profile 1">Profile 1</option>
      </select>
      <button id="manageProfilesBtn" class="w-full text-left py-2 px-4 rounded-lg hover:bg-gray-700 smooth-transition">Manage Profiles</button>
      <div id="profileManager" class="hidden mb-4 p-4 bg-gray-700 rounded-lg smooth-transition">
        <input id="newProfileName" type="text" placeholder="New profile name" class="w-full p-2.5 bg-gray-800 border ring-2 ring-gray-500 border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-gray-200 mb-2 border3 smooth-transition">
        <button id="renameProfileBtn" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-600 mb-2 smooth-transition">Rename Profile</button>
        <button id="addProfileBtn" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-600 mb-2 smooth-transition">Add New Profile</button>
        <button id="deleteProfileBtn" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-red-700 mb-2 smooth-transition">Delete Profile</button>
        <button id="submitDataBtn" class="w-full px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-600 smooth-transition">Submit Data</button>
        <button id="getDataBtn" class="w-full px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-600 mt-2 smooth-transition">Get Data</button>
      </div>
      <button id="dashboardBtn" class="w-full text-left py-2 px-4 rounded-lg bg-blue-600 text-white smooth-transition">Dashboard</button>
      <button id="calendarBtn" class="w-full text-left py-2 px-4 rounded-lg hover:bg-gray-700 smooth-transition">Calendar</button>
      <button id="tradesBtn" class="w-full text-left py-2 px-4 rounded-lg hover:bg-gray-700 smooth-transition">Trades</button>
      <button id="allTradesBtn" class="w-full text-left py-2 px-4 rounded-lg hover:bg-gray-700 smooth-transition">All Trades</button>
      <button id="strategiesBtn" class="w-full text-left py-2 px-4 rounded-lg hover:bg-gray-700 smooth-transition">Strategies</button>
    </div>
    <!-- Main Content -->
    <div id="mainContent" class="flex-1 p-6 overflow-y-auto smooth-transition z-10"></div>
  </div>

  <script>
    // File loading logic
    let gk_isXlsx = false;
    let gk_xlsxFileLookup = {};
    let gk_fileData = {};

    function filledCell(cell) {
      return cell !== '' && cell != null;
    }

    function loadFileData(filename) {
      if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
        try {
          const workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
          const filteredData = jsonData.filter(row => row.some(filledCell));
          let headerRowIndex = filteredData.findIndex((row, index) =>
            row.filter(filledCell).length >= (filteredData[index + 1]?.filter(filledCell).length || 0)
          );
          if (headerRowIndex === -1 || headerRowIndex > 25) {
            headerRowIndex = 0;
          }
          const csv = XLSX.utils.sheet_to_csv(XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)), { header: 1 });
          return csv;
        } catch (e) {
          console.error(e);
          return "";
        }
      }
      return gk_fileData[filename] || "";
    }

    // State
    let profiles = ['Profile 1'];
    let currentProfile = 'Profile 1';
    let trades = {};
    let tagsState = [];
    let strategies = ['Trendfolge', 'Volumen', 'Fibonacci', 'Sweep', 'Range', 'RAIN'];
    let view = 'dashboard';
    let date = new Date().toISOString().split('T')[0];
    let month = new Date().getMonth();
    let year = new Date().getFullYear();
    let edit = null;
    let allTradesFMkt = 'All';
    let allTradesFPrd = 'All';
    let allTradesFTag = 'All';
    let allTradesFStr = null;
    let allTradesFStart = '';
    let allTradesFEnd = '';
    let ovDate = null;
    let showProfileManager = false;
    let newProfileName = 'Profile 1';
    let isSubmitting = false;
    let isLoading = false;
    const markets = ['NASDAQ', 'SP500'];

    // DOM Elements
    const profileSelect = document.getElementById('profileSelect');
    const manageProfilesBtn = document.getElementById('manageProfilesBtn');
    const profileManager = document.getElementById('profileManager');
    const newProfileNameInput = document.getElementById('newProfileName');
    const renameProfileBtn = document.getElementById('renameProfileBtn');
    const addProfileBtn = document.getElementById('addProfileBtn');
    const deleteProfileBtn = document.getElementById('deleteProfileBtn');
    const submitDataBtn = document.getElementById('submitDataBtn');
    const getDataBtn = document.getElementById('getDataBtn');
    const dashboardBtn = document.getElementById('dashboardBtn');
    const calendarBtn = document.getElementById('calendarBtn');
    const tradesBtn = document.getElementById('tradesBtn');
    const allTradesBtn = document.getElementById('allTradesBtn');
    const strategiesBtn = document.getElementById('strategiesBtn');
    const mainContent = document.getElementById('mainContent');

    // Parallax Effect
    window.addEventListener('scroll', () => {
      const parallaxBg = document.querySelector('.parallax-bg');
      const scrollPosition = window.pageYOffset;
      parallaxBg.style.transform = `translate3d(0, ${scrollPosition * 0.5}px, 0)`;
    });

    // Utility Functions
    async function loadProfileData(profile) {
      isLoading = true;
      getDataBtn.textContent = 'Loading...';
      try {
        const response = await fetch(`/api/get_data/${encodeURIComponent(profile)}`);
        const data = await response.json();
        if (response.ok) {
          profiles = Array.isArray(data.profilesList) ? data.profilesList : ['Profile 1'];
          trades = data.trades || {};
          tagsState = Array.isArray(data.tags) ? data.tags : [];
          strategies = Array.isArray(data.strategies) ? data.strategies : ['Trendfolge', 'Volumen', 'Fibonacci', 'Sweep', 'Range', 'RAIN'];
          currentProfile = data.currentProfile || profile;
          updateProfileSelect();
        } else {
          throw new Error(data.error || 'Failed to load profile data');
        }
      } catch (error) {
        console.error('Error loading data:', error);
        alert(`Failed to load profile data: ${error.message}`);
        profiles = ['Profile 1'];
        trades = {};
        tagsState = [];
        strategies = ['Trendfolge', 'Volumen', 'Fibonacci', 'Sweep', 'Range', 'RAIN'];
        currentProfile = profile;
      } finally {
        isLoading = false;
        getDataBtn.textContent = 'Get Data';
      }
      renderView();
    }

    async function handleSubmitData() {
      isSubmitting = true;
      submitDataBtn.textContent = 'Submitting...';
      try {
        const data = { profiles, currentProfile, trades, tags: tagsState, strategies };
        const response = await fetch('/api/submit_data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Failed to submit data');
        alert('Data submitted successfully');
      } catch (error) {
        alert(`Failed to submit data: ${error.message}`);
      } finally {
        isSubmitting = false;
        submitDataBtn.textContent = 'Submit Data';
      }
    }

    function updateProfileSelect() {
      profileSelect.innerHTML = profiles.map(p => `<option value="${p}">${p}</option>`).join('');
      profileSelect.value = currentProfile;
    }

    // View Rendering
    function renderView() {
      mainContent.innerHTML = '';
      if (ovDate) {
        renderDayOverview();
      } else {
        if (view === 'dashboard') renderDashboard();
        else if (view === 'calendar') renderCalendar();
        else if (view === 'trades') renderTrades();
        else if (view === 'allTrades') renderAllTrades();
        else if (view === 'strategies') renderStrategies();
      }
    }

    function renderDashboard() {
      const filteredTrades = getFTrades();
      const { tp, tt, wr, ap, aw, al, mw, ml, md, pf, longWR, shortWR } = calcStats(filteredTrades);
      const chartData = getCData(filteredTrades);
      mainContent.innerHTML = `
        <div class="space-y-6 smooth-transition">
          <h2 class="text-2xl font-semibold text-white">Dashboard</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-800 rounded-lg p-3 border border-gray-600 smooth-transition">
              <p class="text-lg font-semibold text-gray-300">Total Profit/Loss</p>
              <p class="${tp >= 0 ? 'text-green-500' : 'text-red-500'}">${tp.toFixed(2)} $</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-3 border border-gray-600 smooth-transition">
              <p class="text-lg font-semibold text-gray-300">Win Rate</p>
              <p class="text-gray-200">${wr.toFixed(2)}%</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-3 border border-gray-600 smooth-transition">
              <p class="text-lg font-semibold text-gray-300">Profit Factor</p>
              <p class="text-gray-200">${isFinite(pf) ? pf.toFixed(2) : '0.00'}</p>
            </div>
          </div>
          <div class="bg-gray-800 rounded-lg p-4 smooth-transition">
            <h3 class="text-lg font-semibold text-gray-300 mb-4">Profit</h3>
            <canvas id="dashChart"></canvas>
          </div>
        </div>
      `;
      const ctx = document.getElementById('dashChart')?.getContext('2d');
      if (ctx) {
        new Chart(ctx, {
          type: 'line',
          data: chartData,
          options: {
            responsive: true,
            scales: {
              y: { title: { display: true, text: 'Profit ($)', color: '#d1d5db' }, grid: { color: '#4b5563' }, ticks: { color: '#d1d5db' } },
              x: { title: { display: true, text: 'Trades', color: '#d1d5db' }, grid: { color: '#4b5563' }, ticks: { color: '#d1d5db' } }
            },
            plugins: {
              legend: { labels: { color: '#d1d5db' } },
              tooltip: {
                mode: 'index',
                intersect: false,
                callbacks: {
                  label: c => c.dataIndex === 0 ? 'Profit: 0.00 $' : `Profit: ${c.parsed.y.toFixed(2)} $`
                }
              }
            }
          }
        });
      }
    }

    function renderCalendar() {
      const fd = new Date(Date.UTC(year, month, 1));
      const dm = new Date(Date.UTC(year, month + 1, 0)).getDate();
      const utcDay = fd.getUTCDay();
      const sdw = utcDay === 0 ? 6 : utcDay - 1;
      const today = new Date().toISOString().split('T')[0];
      const days = Array(42).fill().map((_, i) => {
        const day = i - sdw + 1;
        if (day < 1 || day > dm) return null;
        const dt = new Date(Date.UTC(year, month, day)).toISOString().split('T')[0];
        return { dt, day };
      });

      mainContent.innerHTML = `
        <div class="bg-gray-800 rounded-lg p-6 smooth-transition">
          <div class="flex justify-between mb-6">
            <button id="prevMonth" class="text-blue-400 hover:text-blue-300">Previous</button>
            <h2 class="text-2xl font-semibold text-white">${new Date(Date.UTC(year, month)).toLocaleString('default', { month: 'long', year: 'numeric' })}</h2>
            <button id="nextMonth" class="text-blue-400 hover:text-blue-300">Next</button>
          </div>
          <div class="grid grid-cols-7 gap-2 text-center">
            ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="font-medium text-gray-400 text-sm">${d}</div>`).join('')}
            ${days.map((x, i) => !x ? `<div key=${i} class="p-3"></div>` : `
              <div
                class="p-3 rounded-lg ${new Date(x.dt) > new Date(today) ? 'bg-gray-600 cursor-not-allowed' : 'cursor-pointer'} ${getProfit(x.dt) > 0 ? 'bg-green-700' : getProfit(x.dt) < 0 ? 'bg-red-700' : 'bg-gray-700'} hover:bg-gray-600 flex flex-col items-center smooth-transition"
                onclick="setOvDate('${x.dt}')"
              >
                <span class="text-white text-base">${x.day}</span>
                <span class="${getProfit(x.dt) > 0 ? 'text-green-300' : 'text-red-300'} text-sm">${getProfit(x.dt) !== 0 ? `${getProfit(x.dt).toFixed(2)} $` : ''}</span>
                ${(trades[x.dt] || []).length > 0 ? `<span class="text-sm text-gray-400">${trades[x.dt].length} Trade${trades[x.dt].length > 1 ? 's' : ''}</span>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('prevMonth').addEventListener('click', () => {
        if (month === 0) { month = 11; year--; } else { month--; }
        renderCalendar();
      });
      document.getElementById('nextMonth').addEventListener('click', () => {
        if (month === 11) { month = 0; year++; } else { month++; }
        renderCalendar();
      });
    }

    function renderTrades() {
      mainContent.innerHTML = `
        <div class="bg-gray-800 rounded-lg p-6 smooth-transition">
          <h2 class="text-2xl font-semibold text-white mb-6">Trades for ${date}</h2>
          <input type="date" id="tradeDate" value="${date}" max="${new Date().toISOString().split('T')[0]}" class="p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 mb-4 w-full smooth-transition">
          <div class="space-y-6">
            <h3 class="text-xl font-semibold text-gray-300 mb-4">Add Trade</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="space-y-4">
                <select id="market" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 smooth-transition">
                  ${markets.map(x => `<option value="${x}">${x}</option>`).join('')}
                </select>
                <input id="riskReward" type="number" step="0.1" placeholder="Risk to Reward *" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 smooth-transition" required>
                <input id="profitLossDollar" type="number" step="0.1" placeholder="Profit ($)*" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 smooth-transition" required>
                <input id="reason" type="text" placeholder="Reason for Trade" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 smooth-transition">
                <div class="p-2.5 bg-gray-700 border border-gray-600 rounded-lg smooth-transition">
                  <p class="text-gray-200 mb-2 text-base">Trade Image</p>
                  <input id="tradeImage" type="file" accept="image/*" class="p-2 bg-gray-700 border border-gray-600 rounded-lg text-gray-200 w-full smooth-transition">
                  <img id="tradeImagePreview" class="hidden mt-2 max-w-[250px] rounded-lg smooth-transition">
                </div>
              </div>
              <div class="space-y-4">
                <select id="tradeType" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 smooth-transition">
                  <option value="Long">Long</option>
                  <option value="Short">Short</option>
                </select>
                <select id="strategy" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 smooth-transition">
                  ${strategies.map(x => `<option value="${x}">${x}</option>`).join('')}
                </select>
                <input id="tradeDuration" type="number" step="1" placeholder="Duration (min)*" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 smooth-transition" required>
                <div class="p-2.5 bg-gray-700 border border-gray-600 rounded-lg smooth-transition">
                  <p class="text-gray-200 mb-2 text-base">Rating</p>
                  <div id="stars" class="flex space-x-1">
                    ${[1, 2, 3, 4, 5].map(s => `<button type="button" class="star text-xl text-gray-400 smooth-transition" data-value="${s}">★</button>`).join('')}
                  </div>
                </div>
              </div>
            </div>
            <div class="mt-4">
              <p class="text-gray-200 mb-2 text-base">Tags</p>
              <div id="tags" class="flex flex-wrap gap-2"></div>
              <div class="mt-2 flex gap-2">
                <input id="newTag" type="text" placeholder="New tag" class="p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 flex-1 smooth-transition">
                <button id="addTag" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-500 text-sm smooth-transition">Add Tag</button>
              </div>
            </div>
            <button id="submitTrade" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-500 text-sm smooth-transition">Add Trade</button>
          </div>
          <div id="tradeList" class="mt-6"></div>
        </div>
      `;
      // Event Listeners for Trades
      let selectedTags = [];
      let stars = 0;
      let imageData = null;

      document.getElementById('tradeDate').addEventListener('change', e => { date = e.target.value; renderTrades(); });
      document.getElementById('tradeImage').addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = e => {
            imageData = e.target.result;
            document.getElementById('tradeImagePreview').src = imageData;
            document.getElementById('tradeImagePreview').classList.remove('hidden');
          };
          reader.readAsDataURL(file);
        }
      });
      document.getElementById('addTag').addEventListener('click', () => {
        const newTag = document.getElementById('newTag').value.trim();
        if (newTag && !tagsState.includes(newTag)) {
          tagsState.push(newTag);
          document.getElementById('newTag').value = '';
          updateTags();
        }
      });
      document.querySelectorAll('.star').forEach(star => {
        star.addEventListener('click', () => {
          stars = parseInt(star.dataset.value);
          document.querySelectorAll('.star').forEach(s => s.classList.toggle('text-yellow-400', parseInt(s.dataset.value) <= stars));
        });
      });
      document.getElementById('submitTrade').addEventListener('click', () => {
        const profit = parseFloat(document.getElementById('profitLossDollar').value);
        const risk = parseFloat(document.getElementById('riskReward').value);
        const duration = parseInt(document.getElementById('tradeDuration').value);
        if (isNaN(profit) || !profit) return alert('Profit must be a valid number.');
        if (isNaN(risk) || !risk) return alert('Risk to Reward must be a valid number.');
        if (isNaN(duration) || !duration) return alert('Duration must be a valid number.');
        const trade = {
          date,
          market: document.getElementById('market').value,
          tradeType: document.getElementById('tradeType').value,
          riskReward: risk,
          strategy: document.getElementById('strategy').value,
          strategies: [document.getElementById('strategy').value],
          profitLossDollar: profit,
          tradeDuration: duration,
          reason: document.getElementById('reason').value,
          stars,
          image: imageData,
          tags: selectedTags
        };
        if (edit) {
          trades[date][edit.index] = trade;
          edit = null;
        } else {
          trades[date] = trades[date] || [];
          trades[date].push(trade);
        }
        resetTradeForm();
        renderTrades();
      });

      function updateTags() {
        const tagsContainer = document.getElementById('tags');
        tagsContainer.innerHTML = tagsState.map(tag => `
          <button class="px-3 py-1 rounded-lg text-sm mr-2 smooth-transition ${selectedTags.includes(tag) ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-200'}" onclick="toggleTag('${tag}')">${tag}</button>
        `).join('');
        document.getElementById('tradeList').innerHTML = (trades[date] || []).map((trade, i) => `
          <div class="p-3.5 bg-gray-700 rounded-lg mb-1 smooth-transition">
            <p class="text-gray-200 text-base"><strong>${(trade.profitLossDollar || 0).toFixed(2)} $</strong> (${trade.market}, R:R ${trade.riskReward || 0})</p>
            <p class="text-sm text-gray-400">Type: ${trade.tradeType || 'Long'}</p>
            <p class="text-sm text-gray-400">Main Reason: ${trade.strategy}</p>
            <p class="text-sm text-gray-400">Tags: ${(trade.tags || []).join(', ')}</p>
            <p class="text-sm text-gray-400">Duration: ${trade.tradeDuration || 0} min, Stars: ${trade.stars || 0}</p>
            ${trade.image ? `<img src="${trade.image}" alt="Trade screenshot" class="mt-2 max-w-[250px] rounded-lg smooth-transition">` : ''}
            <div class="mt-2 flex space-x-2">
              <button onclick="editTrade(${i})" class="px-3 py-1 bg-blue-600 text-white rounded-lg hover:bg-blue-500 text-sm smooth-transition">Edit</button>
              <button onclick="deleteTrade(${i})" class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500 text-sm smooth-transition">Delete</button>
            </div>
          </div>
        `).join('');
      }

      function resetTradeForm() {
        document.getElementById('market').value = markets[0];
        document.getElementById('tradeType').value = 'Long';
        document.getElementById('riskReward').value = '';
        document.getElementById('strategy').value = strategies[0] || '';
        document.getElementById('profitLossDollar').value = '';
        document.getElementById('tradeDuration').value = '';
        document.getElementById('reason').value = '';
        document.getElementById('tradeImage').value = '';
        document.getElementById('tradeImagePreview').classList.add('hidden');
        stars = 0;
        selectedTags = [];
        document.querySelectorAll('.star').forEach(s => s.classList.remove('text-yellow-400'));
        updateTags();
      }

      window.toggleTag = tag => {
        selectedTags = selectedTags.includes(tag) ? selectedTags.filter(t => t !== tag) : [...selectedTags, tag];
        updateTags();
      };

      window.editTrade = index => {
        edit = { index };
        const trade = trades[date][index];
        document.getElementById('market').value = trade.market;
        document.getElementById('tradeType').value = trade.tradeType;
        document.getElementById('riskReward').value = trade.riskReward;
        document.getElementById('strategy').value = trade.strategy;
        document.getElementById('profitLossDollar').value = trade.profitLossDollar;
        document.getElementById('tradeDuration').value = trade.tradeDuration;
        document.getElementById('reason').value = trade.reason;
        stars = trade.stars || 0;
        selectedTags = trade.tags || [];
        imageData = trade.image;
        if (trade.image) {
          document.getElementById('tradeImagePreview').src = trade.image;
          document.getElementById('tradeImagePreview').classList.remove('hidden');
        }
        document.querySelectorAll('.star').forEach(s => s.classList.toggle('text-yellow-400', parseInt(s.dataset.value) <= stars));
        updateTags();
      };

      window.deleteTrade = index => {
        trades[date].splice(index, 1);
        if (!trades[date].length) delete trades[date];
        renderTrades();
      };

      updateTags();
    }

    function renderStrategies() {
      mainContent.innerHTML = `
        <div class="bg-gray-800 rounded-lg p-6 smooth-transition">
          <h2 class="text-2xl font-semibold text-white mb-6">Strategies</h2>
          <div class="space-y-6">
            <div>
              <h3 class="text-xl font-semibold text-gray-300 mb-4">Add New Strategy</h3>
              <div class="flex gap-2">
                <input id="newStrategy" type="text" placeholder="New Strategy" class="p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 flex-1 smooth-transition">
                <button id="addStrategy" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-500 text-sm smooth-transition">Add</button>
              </div>
            </div>
            <div>
              <h3 class="text-xl font-semibold text-gray-300 mb-4">Strategy List</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${strategies.map(s => `
                  <div class="flex justify-between items-center p-3.5 bg-gray-700 rounded-lg smooth-transition">
                    <span class="text-gray-200 text-base">${s}</span>
                    <button onclick="deleteStrategy('${s}')" class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500 text-sm smooth-transition">Delete</button>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('addStrategy').addEventListener('click', () => {
        const newStrategy = document.getElementById('newStrategy').value.trim();
        if (newStrategy && !strategies.includes(newStrategy)) {
          strategies.push(newStrategy);
          document.getElementById('newStrategy').value = '';
          renderStrategies();
        }
      });
      window.deleteStrategy = s => {
        strategies = strategies.filter(x => x !== s);
        renderStrategies();
      };
    }

    function renderAllTrades() {
      const filteredTrades = getFTrades();
      const { tp, tt, wr, ap, aw, al, mw, ml, md, pf } = calcStats(filteredTrades);
      mainContent.innerHTML = `
        <div class="bg-gray-800 rounded-lg p-6 smooth-transition">
          <h2 class="text-2xl font-semibold text-white mb-6">All Trades</h2>
          <div class="flex flex-col sm:flex-row sm:space-x-4 mb-6 flex-wrap gap-2 sm:gap-4">
            <input id="startDate" type="date" value="${allTradesFStart}" class="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto smooth-transition">
            <input id="endDate" type="date" value="${allTradesFEnd}" class="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto smooth-transition">
            <select id="marketFilter" class="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto smooth-transition">
              <option value="All">All Markets</option>
              ${markets.map(x => `<option value="${x}">${x}</option>`).join('')}
            </select>
            <select id="periodFilter" class="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto smooth-transition">
              <option value="All">All Time</option>
              <option value="Week">This Week</option>
              <option value="Month">Last Month</option>
              <option value="Quarter">Last Quarter</option>
            </select>
            <select id="tagFilter" class="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto smooth-transition">
              <option value="All">All Tags</option>
              ${tagsState.map(x => `<option value="${x}">${x}</option>`).join('')}
            </select>
            <select id="ratingFilter" class="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto smooth-transition">
              <option value="">All Ratings</option>
              ${[1, 2, 3, 4, 5].map(s => `<option value="${s}">${s} Stars</option>`).join('')}
            </select>
            <button id="clearFilters" class="p-2.5 bg-gray-600 text-white rounded-lg hover:bg-gray-500 text-sm smooth-transition">Clear Filters</button>
          </div>
          <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="bg-gray-800 rounded-lg p-3 border border-gray-600 smooth-transition">
                <p class="text-lg font-semibold text-gray-300">Total Profit/Loss</p>
                <p class="${tp >= 0 ? 'text-green-500' : 'text-red-500'}">${tp.toFixed(2)} $</p>
              </div>
              <div class="bg-gray-800 rounded-lg p-3 border border-gray-600 smooth-transition">
                <p class="text-lg font-semibold text-gray-300">Win Rate</p>
                <p class="text-gray-200">${wr.toFixed(2)}%</p>
              </div>
              <div class="bg-gray-800 rounded-lg p-3 border border-gray-600 smooth-transition">
                <p class="text-lg font-semibold text-gray-300">Total Trades</p>
                <p class="text-gray-200">${tt}</p>
              </div>
            </div>
            <div id="tradeList" class="mt-6"></div>
          </div>
        </div>
      `;
      document.getElementById('startDate').addEventListener('change', e => { allTradesFStart = e.target.value; renderAllTrades(); });
      document.getElementById('endDate').addEventListener('change', e => { allTradesFEnd = e.target.value; renderAllTrades(); });
      document.getElementById('marketFilter').addEventListener('change', e => { allTradesFMkt = e.target.value; renderAllTrades(); });
      document.getElementById('periodFilter').addEventListener('change', e => { allTradesFPrd = e.target.value; renderAllTrades(); });
      document.getElementById('tagFilter').addEventListener('change', e => { allTradesFTag = e.target.value; renderAllTrades(); });
      document.getElementById('ratingFilter').addEventListener('change', e => { allTradesFStr = e.target.value ? parseInt(e.target.value) : null; renderAllTrades(); });
      document.getElementById('clearFilters').addEventListener('click', () => {
        allTradesFMkt = 'All';
        allTradesFPrd = 'All';
        allTradesFTag = 'All';
        allTradesFStr = null;
        allTradesFStart = '';
        allTradesFEnd = '';
        renderAllTrades();
      });
      document.getElementById('tradeList').innerHTML = filteredTrades.map((trade, i) => `
        <div class="p-3.5 bg-gray-700 rounded-lg mb-1 smooth-transition">
          <p class="text-gray-200 text-base"><strong>${(trade.profitLossDollar || 0).toFixed(2)} $</strong> (${trade.market}, R:R ${trade.riskReward || 0})</p>
          <p class="text-sm text-gray-400">Type: ${trade.tradeType || 'Long'}</p>
          <p class="text-sm text-gray-400">Date: ${trade.date}</p>
          <p class="text-sm text-gray-400">Tags: ${(trade.tags || []).join(', ')}</p>
          <button onclick="deleteTradeAll('${trade.date}', ${i})" class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500 mt-2 text-sm smooth-transition">Delete</button>
        </div>
      `).join('');
    }

    function renderDayOverview() {
      const dayTrades = trades[ovDate] || [];
      const { tp, tt, wr, ap, aw, al, mw, ml, md, pf, longWR, shortWR } = calcStats(dayTrades);
      mainContent.innerHTML = `
        <div class="bg-gray-800 rounded-lg p-6 smooth-transition">
          <div class="flex justify-between mb-6">
            <h3 class="text-2xl font-semibold text-white">Day Overview: ${ovDate}</h3>
            <button onclick="setOvDate(null)" class="px-4 py-1.5 bg-gray-600 text-white rounded-lg hover:bg-gray-500 text-sm smooth-transition">Close</button>
          </div>
          <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="p-3 bg-gray-700 rounded-lg border border-gray-600 smooth-transition">
                <p class="text-lg font-semibold text-gray-300">Total Profit/Loss</p>
                <p class="${tp >= 0 ? 'text-green-500' : 'text-red-500'}">${tp.toFixed(2)} $</p>
              </div>
              <div class="p-3 bg-gray-700 rounded-lg border border-gray-600 smooth-transition">
                <p class="text-lg font-semibold text-gray-300">Win Rate</p>
                <p class="text-gray-200">${wr.toFixed(2)}%</p>
              </div>
              <div class="p-3 bg-gray-700 rounded-lg border border-gray-600 smooth-transition">
                <p class="text-lg font-semibold text-gray-300">Total Trades</p>
                <p class="text-gray-200">${tt}</p>
              </div>
            </div>
            ${dayTrades.length > 0 ? `
              <div class="bg-gray-800 rounded-lg p-4 smooth-transition">
                <h3 class="text-lg font-semibold text-gray-300 mb-4">Profit (Day)</h3>
                <canvas id="dayChart-${ovDate}"></canvas>
              </div>
            ` : ''}
            ${dayTrades.length > 0 ? `
              <div>
                <h3 class="text-xl font-semibold text-gray-300 mb-4">Trade List</h3>
                <div>
                  ${dayTrades.map((trade, i) => `
                    <div class="p-3.5 bg-gray-700 rounded-lg mb-1 smooth-transition">
                      <p class="text-gray-200 text-base"><strong>${(trade.profitLossDollar || 0).toFixed(2)} $</strong> (${trade.market}, R:R ${trade.riskReward || 0})</p>
                      <p class="text-sm text-gray-400">Type: ${trade.tradeType || 'Long'}</p>
                      <p class="text-sm text-gray-400">Main Reason: ${trade.strategy}</p>
                      <p class="text-sm text-gray-400">Tags: ${(trade.tags || []).join(', ')}</p>
                      <p class="text-sm text-gray-400">Duration: ${trade.tradeDuration || 0} min, Stars: ${trade.stars || 0}</p>
                      ${trade.image ? `<img src="${trade.image}" alt="Trade screenshot" class="mt-2 max-w-[250px] rounded-lg cursor-pointer smooth-transition">` : ''}
                      <button onclick="deleteTradeDay('${ovDate}', ${i})" class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500 text-sm smooth-transition">Delete</button>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
      if (dayTrades.length) {
        const ctx = document.getElementById(`dayChart-${ovDate}`)?.getContext('2d');
        if (ctx) {
          const chartData = {
            labels: dayTrades.length ? ['Start', ...dayTrades.map((_, i) => `Trade ${i + 1}`)] : ['Start'],
            datasets: [{
              label: 'Profit ($)',
              data: [0, ...dayTrades.reduce((a, x) => [...a, a[a.length - 1] + (x.profitLossDollar || 0)], [0]).slice(1)],
              tradeData: [null, ...dayTrades],
              borderColor: 'rgb(59, 130, 246)',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              tension: 0.4,
              fill: true,
              pointBackgroundColor: 'rgb(59, 130, 246)',
              pointBorderColor: '#fff',
              pointRadius: 4,
              pointHoverRadius: 6
            }]
          };
          new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: {
              responsive: true,
              scales: {
                y: { title: { display: true, text: 'Profit ($)', color: '#d1d5db' }, grid: { color: '#4b5563' }, ticks: { color: '#d1d5db' } },
                x: { title: { display: true, text: 'Trades', color: '#d1d5db' }, grid: { color: '#4b5563' }, ticks: { color: '#d1d5db' } }
              },
              plugins: {
                legend: { labels: { color: '#d1d5db' } },
                tooltip: {
                  mode: 'index',
                  intersect: false,
                  callbacks: {
                    label: c => c.dataIndex === 0 ? 'Profit: 0.00 $' : `Profit: ${c.parsed.y.toFixed(2)} $`
                  }
                }
              }
            }
          });
        }
      }
    }

    // Helper Functions
    function getProfit(d) {
      return (trades[d] || []).reduce((s, t) => s + (t.profitLossDollar || 0), 0) || 0;
    }

    function getFTrades() {
      let f = Object.values(trades).flat().filter(t => t && typeof t === 'object');
      if (allTradesFMkt !== 'All') f = f.filter(t => t.market === allTradesFMkt);
      if (allTradesFPrd !== 'All') {
        const n = new Date();
        let s;
        if (allTradesFPrd === 'Week') {
          s = new Date(n);
          s.setDate(n.getDate() - (n.getDay() || 7) + 1);
        } else {
          s = new Date(n.getFullYear(), n.getMonth() - { Month: 1, Quarter: 3 }[allTradesFPrd], n.getDate());
        }
        f = f.filter(t => new Date(t.date) >= s && new Date(t.date) <= n);
      }
      if (allTradesFTag !== 'All') f = f.filter(t => (t.tags || []).includes(allTradesFTag));
      if (allTradesFStr !== null) f = f.filter(t => (t.stars || 0) === allTradesFStr);
      if (allTradesFStart && allTradesFEnd) f = f.filter(t => new Date(t.date) >= new Date(allTradesFStart) && new Date(t.date) <= new Date(allTradesFEnd));
      return f;
    }

    function getCData(t) {
      if (!Array.isArray(t)) return { labels: [], datasets: [{ label: 'Profit ($)', data: [0], tradeData: [null], borderColor: 'rgb(59, 130, 246)', backgroundColor: 'rgba(59, 130, 246, 0.1)', tension: 0.4, fill: true, pointBackgroundColor: 'rgb(59, 130, 246)', pointBorderColor: '#fff', pointRadius: 4, pointHoverRadius: 6 }] };
      const s = t.sort((a, b) => new Date(a.date) - new Date(b.date));
      let sum = 0;
      const data = s.length ? [0, ...s.map(x => sum += (x.profitLossDollar || 0))] : [0];
      const tradeData = s.length ? [null, ...s] : [null];
      const labels = s.length ? ['Start', ...s.map((_, i) => `Trade ${i + 1}`)] : ['Start'];
      return { labels, datasets: [{ label: 'Profit ($)', data, tradeData, borderColor: 'rgb(59, 130, 246)', backgroundColor: 'rgba(59, 130, 246, 0.1)', tension: 0.4, fill: true, pointBackgroundColor: 'rgb(59, 130, 246)', pointBorderColor: '#fff', pointRadius: 4, pointHoverRadius: 6 }] };
    }

    function calcStats(t) {
      const f = t || [];
      const tp = f.reduce((s, x) => s + (x.profitLossDollar || 0), 0) || 0;
      const tt = f.length || 0;
      const longTrades = f.filter(x => x.tradeType === 'Long');
      const shortTrades = f.filter(x => x.tradeType === 'Short');
      const longWR = longTrades.length > 0 ? (longTrades.filter(x => (x.profitLossDollar || 0) > 0).length / longTrades.length) * 100 : 0;
      const shortWR = shortTrades.length > 0 ? (shortTrades.filter(x => (x.profitLossDollar || 0) > 0).length / shortTrades.length) * 100 : 0;
      const w = f.filter(x => (x.profitLossDollar || 0) > 0);
      const wr = tt > 0 ? (w.length / tt) * 100 : 0;
      const ap = tt > 0 ? tp / tt : 0;
      const aw = w.length > 0 ? w.reduce((s, x) => s + (x.profitLossDollar || 0), 0) / w.length : 0;
      const al = f.filter(x => (x.profitLossDollar || 0) < 0).length > 0 ? f.filter(x => (x.profitLossDollar || 0) < 0).reduce((s, x) => s + (x.profitLossDollar || 0), 0) / f.filter(x => (x.profitLossDollar || 0) < 0).length : 0;
      const mw = f.length > 0 ? Math.max(...f.map(x => x.profitLossDollar || 0), 0) : 0;
      const ml = f.length > 0 ? Math.min(...f.map(x => x.profitLossDollar || 0), 0) : 0;
      const [s, p, dd] = f.reduce(([s, p, d], x) => {
        s += x.profitLossDollar || 0;
        p = Math.max(p, s);
        d.push(p - s);
        return [s, p, d];
      }, [0, 0, []]);
      const md = dd.length > 0 ? Math.max(...dd, 0) : 0;
      const pf = w.length > 0 && f.filter(x => (x.profitLossDollar || 0) < 0).length > 0 ? w.reduce((s, x) => s + (x.profitLossDollar || 0), 0) / Math.abs(f.filter(x => (x.profitLossDollar || 0) < 0).reduce((s, x) => s + (x.profitLossDollar || 0), 0)) : w.length > 0 ? Infinity : 0;
      return { tp, tt, longWR, shortWR, wr, ap, aw, al, mw, ml, md, pf, t: f };
    }

    // Event Listeners
    profileSelect.addEventListener('change', async e => {
      currentProfile = e.target.value;
      await loadProfileData(currentProfile);
      view = 'dashboard';
      ovDate = null;
      showProfileManager = false;
      renderView();
      updateButtonStyles();
    });

    manageProfilesBtn.addEventListener('click', () => {
      showProfileManager = !showProfileManager;
      profileManager.classList.toggle('hidden', !showProfileManager);
    });

    renameProfileBtn.addEventListener('click', async () => {
      const name = newProfileNameInput.value.trim();
      if (!name || name === currentProfile || !profiles.includes(currentProfile)) return;
      profiles = profiles.map(p => p === currentProfile ? name : p);
      currentProfile = name;
      updateProfileSelect();
      showProfileManager = false;
      profileManager.classList.add('hidden');
      await handleSubmitData();
    });

    addProfileBtn.addEventListener('click', async () => {
      const name = newProfileNameInput.value.trim();
      if (!name || profiles.includes(name)) return;
      profiles.push(name);
      currentProfile = name;
      trades = {};
      tagsState = [];
      strategies = ['Trendfolge', 'Volumen', 'Fibonacci', 'Sweep', 'Range', 'RAIN'];
      updateProfileSelect();
      showProfileManager = false;
      profileManager.classList.add('hidden');
      await handleSubmitData();
      renderView();
    });

    deleteProfileBtn.addEventListener('click', async () => {
      if (profiles.length <= 1 || !confirm(`Are you sure you want to delete the profile "${currentProfile}"?`)) return;
      profiles = profiles.filter(p => p !== currentProfile);
      currentProfile = profiles[0] || 'Profile 1';
      updateProfileSelect();
      await loadProfileData(currentProfile);
      showProfileManager = false;
      profileManager.classList.add('hidden');
      await handleSubmitData();
    });

    submitDataBtn.addEventListener('click', handleSubmitData);
    getDataBtn.addEventListener('click', () => loadProfileData(currentProfile));

    dashboardBtn.addEventListener('click', () => { view = 'dashboard'; ovDate = null; showProfileManager = false; profileManager.classList.add('hidden'); renderView(); updateButtonStyles(); });
    calendarBtn.addEventListener('click', () => { view = 'calendar'; ovDate = null; showProfileManager = false; profileManager.classList.add('hidden'); renderView(); updateButtonStyles(); });
    tradesBtn.addEventListener('click', () => { view = 'trades'; ovDate = null; showProfileManager = false; profileManager.classList.add('hidden'); renderView(); updateButtonStyles(); });
    allTradesBtn.addEventListener('click', () => { view = 'allTrades'; ovDate = null; showProfileManager = false; profileManager.classList.add('hidden'); renderView(); updateButtonStyles(); });
    strategiesBtn.addEventListener('click', () => { view = 'strategies'; ovDate = null; showProfileManager = false; profileManager.classList.add('hidden'); renderView(); updateButtonStyles(); });

    function updateButtonStyles() {
      [dashboardBtn, calendarBtn, tradesBtn, allTradesBtn, strategiesBtn].forEach(btn => {
        btn.classList.toggle('bg-blue-600', btn.id === `${view}Btn`);
        btn.classList.toggle('text-white', btn.id === `${view}Btn`);
        btn.classList.toggle('hover:bg-gray-700', btn.id !== `${view}Btn`);
      });
    }

    window.setOvDate = dt => {
      if (new Date(dt) <= new Date()) {
        date = dt;
        ovDate = dt;
        renderView();
      }
    };

    window.deleteTradeAll = (d, i) => {
      trades[d].splice(i, 1);
      if (!trades[d].length) delete trades[d];
      renderAllTrades();
    };

    window.deleteTradeDay = (d, i) => {
      if (confirm('Are you sure you want to delete this trade?')) {
        trades[d].splice(i, 1);
        if (!trades[d].length) {
          delete trades[d];
          ovDate = null;
        }
        renderView();
      }
    };

    // Initial Load
    loadProfileData(currentProfile);
  </script>
</body>
</html>
