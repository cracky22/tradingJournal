<script type="text/javascript">

          return cell !== '' && cell != null;

        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });

                );

<body className="bg-gray-900 text-gray-200">
  <div id="root"></div>
  <script type="text/javascript">

                );

                  headerRowIndex = 0;

                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));

  <script type="text/babel">
    const { useState, useEffect } = React;

    class ErrorBoundary extends React.Component {
      state = { error: null };
      static getDerivedStateFromError(error) { return { error }; }
      render() { return this.state.error ? <div className="text-red-500 p-4">Error: {this.state.error.message}</div> : this.props.children; }
    }

    const markets = ['NASDAQ', 'SP500'];

    function App() {
      const [profiles, setProfiles] = useState(['Profile 1']);
      const [currentProfile, setCurrentProfile] = useState('Profile 1');
      const [trades, setTrades] = useState({});
      const [tagsState, setTagsState] = useState([]);
      const [strategies, setStrategies] = useState(['Trendfolge', 'Volumen', 'Fibonacci', 'Sweep', 'Range', 'RAIN']);
      const [view, setView] = useState('dashboard');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [month, setMonth] = useState(new Date().getMonth());
      const [year, setYear] = useState(new Date().getFullYear());
      const [edit, setEdit] = useState(null);
      const [allTradesFMkt, setAllTradesFMkt] = useState('All');
      const [allTradesFPrd, setAllTradesFPrd] = useState('All');
      const [allTradesFTag, setAllTradesFTag] = useState('All');
      const [allTradesFStr, setAllTradesFStr] = useState(null);
      const [allTradesFStart, setAllTradesFStart] = useState('');
      const [allTradesFEnd, setAllTradesFEnd] = useState('');
      const [ovDate, setOvDate] = useState(null);
      const [showProfileManager, setShowProfileManager] = useState(false);
      const [newProfileName, setNewProfileName] = useState('Profile 1');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isLoading, setIsLoading] = useState(false);

      useEffect(() => {
        loadProfileData(currentProfile);
      }, []);

      const loadProfileData = async (profile) => {
        setIsLoading(true);
        try {
          const response = await fetch(`/api/get_data/${encodeURIComponent(profile)}`);
          const data = await response.json();
          if (response.ok) {
            const profilesList = Array.isArray(data.profilesList) ? data.profilesList : ['Profile 1'];
            setProfiles(profilesList.length > 0 ? profilesList : ['Profile 1']);
            setTrades(data.trades || {});
            setTagsState(Array.isArray(data.tags) ? data.tags : []);
            setStrategies(Array.isArray(data.strategies) ? data.strategies : ['Trendfolge', 'Volumen', 'Fibonacci', 'Sweep', 'Range', 'RAIN']);
            setCurrentProfile(data.currentProfile || profile);
          } else {
            throw new Error(data.error || 'Failed to load profile data');
          }
        } catch (error) {
          console.error('Error loading data:', error);
          alert(`Failed to load profile data: ${error.message}`);
          setProfiles(['Profile 1']);
          setTrades({});
          setTagsState([]);
          setStrategies(['Trendfolge', 'Volumen', 'Fibonacci', 'Sweep', 'Range', 'RAIN']);
          setCurrentProfile(profile);
        } finally {
          setIsLoading(false);
        }
      };

      const handleSubmitData = async () => {
        setIsSubmitting(true);
        try {
          const data = {
            profiles: Array.isArray(profiles) ? profiles : ['Profile 1'],
            currentProfile: currentProfile,
            trades: trades,
            tags: tagsState,
            strategies: strategies
          };
          const response = await fetch('/api/submit_data', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
          });
          const result = await response.json();
          if (response.ok) {
            alert('Data submitted successfully');
          } else {
            throw new Error(result.error || 'Failed to submit data');
          }
        } catch (error) {
          alert(`Failed to submit data: ${error.message}`);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleProfileChange = async (profile) => {
        if (!Array.isArray(profiles) || !profiles.includes(profile)) {
          console.warn('Invalid profile selection, resetting to default');
          setProfiles(['Profile 1']);
          setCurrentProfile('Profile 1');
          await loadProfileData('Profile 1');
          return;
        }
        setCurrentProfile(profile);
        await loadProfileData(profile);
        setView('dashboard');
        setOvDate(null);
        setShowProfileManager(false);
      };

      const handleRenameProfile = async () => {
        const name = newProfileName.trim();
        if (!name || name === currentProfile || !Array.isArray(profiles) || !profiles.includes(currentProfile)) return;

        const updatedProfiles = profiles.map(p => p === currentProfile ? name : p);
        setProfiles(updatedProfiles);
        setCurrentProfile(name);
        setShowProfileManager(false);
        await handleSubmitData();
      };

      const handleAddProfile = async () => {
        const name = newProfileName.trim();
        if (!name || (Array.isArray(profiles) && profiles.includes(name))) return;

        const updatedProfiles = Array.isArray(profiles) ? [...profiles, name] : [name];
        setProfiles(updatedProfiles);
        setCurrentProfile(name);
        setTrades({});
        setTagsState([]);
        setStrategies(['Trendfolge', 'Volumen', 'Fibonacci', 'Sweep', 'Range', 'RAIN']);
        setShowProfileManager(false);
        await handleSubmitData();
      };

      const handleDeleteProfile = async () => {
        if (!Array.isArray(profiles) || profiles.length <= 1) return;
        if (!window.confirm(`Are you sure you want to delete the profile "${currentProfile}"?`)) return;

        const updatedProfiles = profiles.filter(p => p !== currentProfile);
        const newCurrentProfile = updatedProfiles[0] || 'Profile 1';
        setProfiles(updatedProfiles);
        setCurrentProfile(newCurrentProfile);
        await loadProfileData(newCurrentProfile);
        setShowProfileManager(false);
        await handleSubmitData();
      };

      const addTrade = (t) => setTrades((p) => ({ ...p, [t.date]: [...(p[t.date] || []), t] }));
      const updTrade = (d, i, t) => setTrades((p) => ({ ...p, [d]: p[d].map((x, j) => (j === i ? t : x)) }));
      const delTrade = (d, i) => setTrades((p) => {
        const n = { ...p };
        n[d].splice(i, 1);
        if (!n[d].length) delete n[d];
        return n;
      });
      const deleteAllTradesForDate = (d) => setTrades((p) => {
        const n = { ...p };
        delete n[d];
        return n;
      });
      const addTag = (t) => !tagsState.includes(t) && setTagsState((p) => [...p, t]);
      const delTag = (t) => {
        setTagsState((p) => p.filter((x) => x !== t));
        setTrades((p) => {
          const updatedTrades = {};
          for (let [date, tradeList] of Object.entries(p))
            updatedTrades[date] = tradeList.map((trade) => ({ ...trade, tags: trade.tags.filter((tag) => tag !== t) }));
          return updatedTrades;
        });
      };
      const addStrategy = (s) => !strategies.includes(s) && setStrategies((p) => [...p, s]);
      const delStrategy = (s) => setStrategies((p) => p.filter((x) => x !== s));
      const getProfit = (d) => (trades[d] || []).reduce((s, t) => s + (t.profitLossDollar || 0), 0) || 0;
      const getFTrades = () => {
        let f = Object.values(trades).flat().filter((t) => t && typeof t === 'object');
        if (allTradesFMkt !== 'All') f = f.filter((t) => t.market === allTradesFMkt);
        if (allTradesFPrd !== 'All') {
          const n = new Date();
          let s;
          if (allTradesFPrd === 'Week') {
            s = new Date(n);
            s.setDate(n.getDate() - (n.getDay() || 7) + 1);
          } else s = new Date(n.getFullYear(), n.getMonth() - { Month: 1, Quarter: 3 }[allTradesFPrd], n.getDate());
          f = f.filter((t) => new Date(t.date) >= s && new Date(t.date) <= n);
        }
        if (allTradesFTag !== 'All') f = f.filter((t) => (t.tags || []).includes(allTradesFTag));
        if (allTradesFStr !== null) f = f.filter((t) => (t.stars || 0) === allTradesFStr);
        if (allTradesFStart && allTradesFEnd) f = f.filter((t) => new Date(t.date) >= new Date(allTradesFStart) && new Date(t.date) <= new Date(allTradesFEnd));
        return f;
      };
      const getCData = (t) => {
        if (!Array.isArray(t)) return { labels: [], datasets: [{ label: 'Profit ($)', data: [0], tradeData: [null], borderColor: 'rgb(59, 130, 246)', backgroundColor: 'rgba(59, 130, 246, 0.1)', tension: 0.4, fill: true, pointBackgroundColor: 'rgb(59, 130, 246)', pointBorderColor: '#fff', pointRadius: 4, pointHoverRadius: 6 }] };
        const s = t.sort((a, b) => new Date(a.date) - new Date(b.date));
        let sum = 0;
        const data = s.length ? [0, ...s.map((x) => (sum += x.profitLossDollar || 0))] : [0];
        const tradeData = s.length ? [null, ...s] : [null];
        const labels = s.length ? ['Start', ...s.map((_, i) => `Trade ${i + 1}`)] : ['Start'];
        return { labels, datasets: [{ label: 'Profit ($)', data, tradeData, borderColor: 'rgb(59, 130, 246)', backgroundColor: 'rgba(59, 130, 246, 0.1)', tension: 0.4, fill: true, pointBackgroundColor: 'rgb(59, 130, 246)', pointBorderColor: '#fff', pointRadius: 4, pointHoverRadius: 6 }] };
      };
      const getTimePerfData = (t) => {
        if (!Array.isArray(t)) return { labels: [], datasets: [] };
        const dataPoints = t.map((trade) => ({ x: trade.tradeDuration || 0, y: trade.profitLossDollar || 0 }));
        return { datasets: [{ label: 'Performance by Duration', data: dataPoints, backgroundColor: dataPoints.map((point) => (point.y >= 0 ? 'rgb(34, 197, 94)' : 'rgb(239, 68, 68)')), pointRadius: 5, pointHoverRadius: 7 }] };
      };

      return (
        <ErrorBoundary>
          <div className="min-h-screen bg-gray-900 text-gray-200 flex flex-col sm:flex-row">
            <div className="w-full sm:w-16 md:w-56 bg-gray-800 p-4 flex flex-col">
              <h1 className="text-2xl font-bold text-white mb-6 hidden sm:block">Trading Journal</h1>
              <h1 className="text-xl font-bold text-white mb-4 sm:hidden">TJ</h1>
              <select
                value={currentProfile}
                onChange={(e) => handleProfileChange(e.target.value)}
                className="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 mb-4"
              >
                {Array.isArray(profiles) ? profiles.map((p) => (
                  <option key={p} value={p}>
                    {p}
                  </option>
                )) : (
                  <option value="Profile 1">Profile 1</option>
                )}
              </select>
              <button
                onClick={() => setShowProfileManager(!showProfileManager)}
                className={`w-full text-left py-2 px-4 rounded-lg ${showProfileManager ? 'bg-blue-600 text-white' : 'hover:bg-gray-700'}`}
              >
                <span className="block sm:truncate">Manage Profiles</span>
              </button>
              {showProfileManager && (
                <div className="mb-4 p-4 bg-gray-700 rounded-lg">
                  <input
                    type="text"
                    value={newProfileName}
                    onChange={(e) => setNewProfileName(e.target.value)}
                    placeholder="New profile name"
                    className="w-full p-2.5 bg-gray-800 border ring-2 ring-gray-500 border-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-gray-200 mb-2 border3"
                  />
                  <button
                    onClick={handleRenameProfile}
                    className="w-full px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-600 mb-2"
                  >
                    Rename Profile
                  </button>
                  <button
                    onClick={handleAddProfile}
                    className="w-full px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-600 mb-2"
                  >
                    Add New Profile
                  </button>
                  <button
                    onClick={handleDeleteProfile}
                    className="w-full px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-red-800 mb-2"
                  >
                    Delete Profile
                  </button>
                  <button
                    onClick={handleSubmitData}
                    disabled={isSubmitting}
                    className={`w-full px-4 py-2 text-white rounded-lg ${isSubmitting ? 'bg-gray-900 cursor-not-allowed' : 'bg-gray-900 hover:bg-gray-600'}`}
                  >
                    {isSubmitting ? 'Submitting...' : 'Submit Data'}
                  </button>
                  <button
                    onClick={() => loadProfileData(currentProfile)}
                    disabled={isLoading}
                    className={`w-full px-4 py-2 text-white rounded-lg mt-2 ${isLoading ? 'bg-gray-900 cursor-not-allowed' : 'bg-gray-900 hover:bg-gray-600'}`}
                  >
                    {isLoading ? 'Loading...' : 'Get Data'}
                  </button>
                </div>
              )}
              {['dashboard', 'calendar', 'trades', 'allTrades', 'strategies'].map((v) => (
                <button
                  key={v}
                  onClick={() => {
                    setView(v);
                    setOvDate(null);
                    setShowProfileManager(false);
                  }}
                  className={`w-full text-left py-2 px-4 rounded-lg ${view === v ? 'bg-blue-600 text-white' : 'hover:bg-gray-700'}`}
                >
                  <span className="block sm:truncate">{v === 'allTrades' ? 'All Trades' : v.charAt(0).toUpperCase() + v.slice(1)}</span>
                </button>
              ))}
            </div>
            <div className="flex-1 p-6 overflow-y-auto">
              {ovDate ? <DayOverview t={trades} d={ovDate} sd={setOvDate} gp={getProfit} gc={getCData} delTrade={delTrade} /> : (
                <>
                  {view === 'dashboard' && <DashboardView t={trades} gc={getCData} gp={getProfit} gf={getFTrades} gtp={getTimePerfData} />}
                  {view === 'calendar' && <CalendarView t={trades} d={date} sd={setDate} gp={getProfit} m={month} y={year} sm={setMonth} sy={setYear} so={setOvDate} />}
                  {view === 'trades' && <TradesView t={trades} at={addTrade} ut={updTrade} dt={delTrade} d={date} sd={setDate} tg={tagsState} ag={addTag} dg={delTag} st={strategies} edit={edit} setEdit={setEdit} editTrade={(trade, index) => setEdit({ ...trade, index })} />}
                  {view === 'allTrades' && <AllTradesView t={trades} gf={getFTrades} fs={allTradesFStr} sfs={setAllTradesFStr} fm={allTradesFMkt} sfm={setAllTradesFMkt} ft={allTradesFTag} sft={setAllTradesFTag} fp={allTradesFPrd} sfp={setAllTradesFPrd} fst={allTradesFStart} sfst={setAllTradesFStart} fe={allTradesFEnd} sfe={setAllTradesFEnd} dt={delTrade} tg={tagsState} st={strategies} />}
                  {view === 'strategies' && <StrategiesView strategies={strategies} addStrategy={addStrategy} delStrategy={delStrategy} />}
                </>
              )}
            </div>
          </div>
        </ErrorBoundary>
      );
    }

    function CalendarView({ t, d, sd, gp, m, y, sm, sy, so }) {
      const fd = new Date(Date.UTC(y, m, 1));
      const dm = new Date(Date.UTC(y, m + 1, 0)).getDate();
      const utcDay = fd.getUTCDay();
      const sdw = utcDay === 0 ? 6 : utcDay - 1;
      const today = new Date().toISOString().split('T')[0];
      const days = Array(42)
        .fill()
        .map((_, i) => {
          const day = i - sdw + 1;
          if (day < 1 || day > dm) return null;
          const dt = new Date(Date.UTC(y, m, day)).toISOString().split('T')[0];
          return { dt, day };
        });

      return (
        <div className="bg-gray-800 rounded-lg p-6">
          <div className="flex justify-between mb-6">
            <button onClick={() => (m === 0 ? (sm(11), sy(y - 1)) : sm(m - 1))} className="text-blue-400 hover:text-blue-300">
              Previous
            </button>
            <h2 className="text-2xl font-semibold text-white">{new Date(Date.UTC(y, m)).toLocaleString('default', { month: 'long', year: 'numeric' })}</h2>
            <button onClick={() => (m === 11 ? (sm(0), sy(y + 1)) : sm(m + 1))} className="text-blue-400 hover:text-blue-300">
              Next
            </button>
          </div>
          <div className="grid grid-cols-7 gap-2 text-center">
            {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => (
              <div key={d} className="font-medium text-gray-400 text-sm">
                {d}
              </div>
            ))}
            {days.map((x, i) =>
              !x ? (
                <div key={i} className="p-3" />
              ) : (
                <div
                  key={x.dt}
                  onClick={() => (new Date(x.dt) <= new Date(today) ? (sd(x.dt), so(x.dt)) : null)}
                  className={`p-3 rounded-lg ${new Date(x.dt) > new Date(today) ? 'bg-gray-600 cursor-not-allowed' : 'cursor-pointer'} ${gp(x.dt) > 0 ? 'bg-green-700' : gp(x.dt) < 0 ? 'bg-red-700' : 'bg-gray-700'
                    } hover:bg-gray-600 flex flex-col items-center`}
                >
                  <span className="text-white text-base">{x.day}</span>
                  <span className={`text-sm ${gp(x.dt) > 0 ? 'text-green-300' : 'text-red-300'}`}>{gp(x.dt) !== 0 ? `${gp(x.dt).toFixed(2)} $` : ''}</span>
                  {(t[x.dt] || []).length > 0 && <span className="text-sm text-gray-400">{t[x.dt].length} Trade{t[x.dt].length > 1 ? 's' : ''}</span>}
                </div>
              )
            )}
          </div>
        </div>
      );
    }

    function TradesView({ t, at, ut, dt, d, sd, tg, ag, dg, st, edit, setEdit, editTrade }) {
      const [tradeType, setTradeType] = useState('Long');
      const [riskReward, setRiskReward] = useState('');
      const [strategy, setStrategy] = useState(st[0] || '');
      const [profitLossDollar, setProfitLossDollar] = useState('');
      const [tradeDuration, setTradeDuration] = useState('');
      const [reason, setReason] = useState('');
      const [stars, setStars] = useState(0);
      const [market, setMarket] = useState(markets[0] || '');
      const [image, setImage] = useState(null);
      const [tags, setTags] = useState([]);
      const [newTag, setNewTag] = useState('');
      const today = new Date().toISOString().split('T')[0];

      const handleImageUpload = (ev) => {
        const file = ev.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => setImage(e.target.result);
          reader.readAsDataURL(file);
        }
      };

      const resetForm = () => {
        setTradeType('Long');
        setRiskReward('');
        setStrategy(st[0] || '');
        setProfitLossDollar('');
        setTradeDuration('');
        setReason('');
        setStars(0);
        setMarket(markets[0] || '');
        setImage(null);
        setTags([]);
        setNewTag('');
        setEdit(null);
      };

      const submitTrade = () => {
        const profit = parseFloat(profitLossDollar);
        const risk = parseFloat(riskReward);
        const duration = parseInt(tradeDuration);

        if (isNaN(profit) || profitLossDollar === '') {
          alert('Profit must be a valid number.');
          return;
        }
        if (isNaN(risk) || riskReward === '') {
          alert('Risk to Reward must be a valid number.');
          return;
        }
        if (isNaN(duration) || tradeDuration === '') {
          alert('Duration must be a valid number.');
          return;
        }

        const trade = {
          date: d,
          market,
          tradeType,
          riskReward: risk,
          strategy,
          strategies: [strategy],
          profitLossDollar: profit,
          tradeDuration: duration,
          reason,
          stars: parseInt(stars),
          image,
          tags,
        };

        if (edit) {
          ut(d, edit.index, trade);
        } else {
          at(trade);
        }

        resetForm();
      };

      return (
        <div className="bg-gray-800 rounded-lg p-6">
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-semibold text-white">Trades for {d}</h2>
          </div>
          <div className="space-y-6">
            <input
              type="date"
              value={d}

    function calcStats(t) {
      const f = t || [];
      const tp = f.reduce((s, x) => s + (x.profitLossDollar || 0), 0) || 0;
      const tt = f.length || 0;
      const longTrades = f.filter((x) => x.tradeType === 'Long');
      const shortTrades = f.filter((x) => x.tradeType === 'Short');
      const longWR = longTrades.length > 0 ? (longTrades.filter((x) => (x.profitLossDollar || 0) > 0).length / longTrades.length) * 100 : 0;
      const shortWR = shortTrades.length > 0 ? (shortTrades.filter((x) => (x.profitLossDollar || 0) > 0).length / shortTrades.length) * 100 : 0;
      const w = f.filter((x) => (x.profitLossDollar || 0) > 0);
      const wr = tt > 0 ? (w.length / tt) * 100 : 0;
      const ap = tt > 0 ? tp / tt : 0;
      const aw = w.length > 0 ? w.reduce((s, x) => s + (x.profitLossDollar || 0), 0) / w.length : 0;
      const al = f.filter((x) => (x.profitLossDollar || 0) < 0).length > 0 ? f.filter((x) => (x.profitLossDollar || 0) < 0).reduce((s, x) => s + (x.profitLossDollar || 0), 0) / f.filter((x) => (x.profitLossDollar || 0) < 0).length : 0;
      const mw = f.length > 0 ? Math.max(...f.map((x) => x.profitLossDollar || 0), 0) : 0;
      const ml = f.length > 0 ? Math.min(...f.map((x) => x.profitLossDollar || 0), 0) : 0;
      const [s, p, dd] = f.reduce(
        ([s, p, d], x) => {
          s += x.profitLossDollar || 0;
          p = Math.max(p, s);
          d.push(p - s);
          return [s, p, d];
        },
        [0, 0, []]
      );
      const md = dd.length > 0 ? Math.max(...dd, 0) : 0;
      const pf = w.length > 0 && f.filter((x) => (x.profitLossDollar || 0) < 0).length > 0 ? w.reduce((s, x) => s + (x.profitLossDollar || 0), 0) / Math.abs(f.filter((x) => (x.profitLossDollar || 0) < 0).reduce((s, x) => s + (x.profitLossDollar || 0), 0)) : w.length > 0 ? Infinity : 0;
      return { tp, tt, longWR, shortWR, wr, ap, aw, al, mw, ml, md, pf, t: f };
    }

              value={fst}
              onChange={(e) => sfst(e.target.value)}
              className="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto"
            />
            <input
              type="date"
              value={fe}
              onChange={(e) => sfe(e.target.value)}
              className="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto"
            />
            <select
              value={fm}
              onChange={(e) => sfm(e.target.value)}
              className="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto"
            >
              <option value="All">All Markets</option>
              {markets.map((x) => (
                <option key={x} value={x}>
                  {x}
                </option>
              ))}
            </select>
            <select
              value={fp}
              onChange={(e) => sfp(e.target.value)}
              className="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto"
            >
              <option value="All">All Time</option>
              <option value="Week">This Week</option>
              <option value="Month">Last Month</option>
              <option value="Quarter">Last Quarter</option>
            </select>
            <select
              value={ft}
              onChange={(e) => sft(e.target.value)}
              className="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto"
            >
              <option value="All">All Tags</option>
              {tg.map((x) => (
                <option key={x} value={x}>
                  {x}
                </option>
              ))}
            </select>
            <select
              value={fs || ''}
              onChange={(e) => sfs(e.target.value ? parseInt(e.target.value) : null)}
              className="p-2.5 bg-gray-700 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200 w-full sm:w-auto"
            >
              <option value="">All Ratings</option>
              {[1, 2, 3, 4, 5].map((s) => (
                <option key={s} value={s}>
                  {s} Stars
                </option>
              ))}
            </select>
            <button onClick={clearFilters} className="p-2.5 bg-gray-600 text-white rounded-lg hover:bg-gray-500 text-sm">
              Clear Filters
            </button>
          </div>
          <div className="space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {[
                { l: 'Total Profit/Loss', v: tp.toFixed(2) + ' $', c: tp >= 0 ? 'text-green-500' : 'text-red-500' },
                { l: 'Win Rate', v: `${wr.toFixed(2)}%` },
                { l: 'Profit Factor', v: isFinite(pf) ? pf.toFixed(2) : '0.00' },
                { l: 'Total Trades', v: tt },
                { l: 'Average Profit/Trade', v: `${ap.toFixed(2)} $` },
                { l: 'Average Win', v: `${aw.toFixed(2)} $` },
                { l: 'Max Win Trade', v: `${mw.toFixed(2)} $` },
                { l: 'Average Loss', v: `${al.toFixed(2)} $` },
                { l: 'Max Loss Trade', v: `${ml.toFixed(2)} $` },
                { l: 'Max Drawdown', v: `${(-md).toFixed(2)} $` },
              ].map(({ l, v, c }) => (
                <div key={l} className="bg-gray-800 rounded-lg p-3 border border-gray-600">
                  <p className="text-lg font-semibold text-gray-300">{l}</p>
                  <p className={c || 'text-gray-200'}>{v}</p>
                </div>
              ))}
            </div>
            <div>
              <h3 className="text-xl font-semibold text-gray-300 mb-4">Strategy Performance</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {Object.entries(sp).map(([s, { p, w, t }]) => (
                  <div key={s} className="p-3.5 bg-gray-700 rounded-lg">
                    <p className="text-gray-200 text-base">
                      <strong>{p.toFixed(2)} $</strong> ({w.toFixed(2)}% WR, {t} Trades)
                    </p>
                  </div>
                ))}
              </div>
            </div>
            <div>
              <h3 className="text-xl font-semibold text-gray-300 mb-4">Trade List</h3>
              <div>
                {f.map((x, i) => (
                  <div key={i} className="p-3.5 bg-gray-700 rounded-lg mb-1">
                    <p className="text-gray-200 text-base">
                      <strong>{(x.profitLossDollar || 0).toFixed(2)} $</strong> ({x.market}, R:R {x.riskReward || 0})
                    </p>
                    <p className="text-sm text-gray-400">Type: {x.tradeType || 'Long'}</p>
                    <p className="text-sm text-gray-400">Date: {x.date}</p>
                    <p className="text-sm text-gray-400">Tags: {(x.tags || []).join(', ')}</p>
                    <button onClick={() => dt(x.date, i)} className="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-500 mt-2 text-sm">
                      Delete
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
